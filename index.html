<!DOCTYPE html>

a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
  padding:14px 28px;border-radius:10px;font-weight:600}
small{display:block;margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
